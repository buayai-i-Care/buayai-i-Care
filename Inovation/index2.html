<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คะแนนงาน ม.3</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Sarabun",sans-serif;background:#f3f5f9;color:#222}
header{background:#3b5bdb;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:18px;margin:0}button{font:inherit;cursor:pointer}
.btn{background:#3b5bdb;color:#fff;border:0;border-radius:10px;padding:10px 14px}.btn.light{background:#e7ebff;color:#3b5bdb}.btn.red{background:#e03131}
main{padding:12px;max-width:900px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001;margin-bottom:12px}
input,select,textarea{font:inherit;padding:10px;border:1px solid #ccd;border-radius:10px;width:100%}
#login{max-width:340px;margin:18vh auto;text-align:center}#login input{font-size:24px;text-align:center;margin:12px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.chip{flex:none;border:1px solid #3b5bdb;color:#3b5bdb;background:#fff;border-radius:20px;padding:6px 12px}.chip.on{background:#3b5bdb;color:#fff}
.tbl{overflow:auto;max-height:75vh}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:center;white-space:nowrap}
th{background:#eef1ff;position:sticky;top:0}td.n{text-align:left}.ok{color:#2b8a3e;font-weight:600}.late{color:#e8590c;font-weight:600}.miss{color:#c92a2a}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}.row .nm{flex:1;min-width:0}.row input{width:70px;text-align:center;font-size:18px}
.q{padding:8px 10px;border-radius:8px;border:1px solid #ccd;background:#fff}.saved{background:#d3f9d8!important}.err{background:#ffe3e3!important}
dialog{border:0;border-radius:14px;width:min(92vw,420px)}dialog label{display:block;margin:8px 0 2px;font-size:14px}.hide{display:none}
.msg{color:#c92a2a;min-height:20px}#busy{display:flex}#busy.hide{display:none}
#sg{display:flex;flex-direction:column;gap:4px;margin-top:6px}.sgi{text-align:left;padding:10px;border:1px solid #cfd6f5;border-radius:8px;background:#f8f9ff}
.detail{margin-top:10px;background:#f8f9ff;border-radius:10px;padding:10px}.detail table{margin-top:6px}
.qi{border:1px solid #e1e5f7;border-radius:10px;padding:10px;margin-bottom:8px}.qi.new{background:#fff9db;border-color:#fcc419}.qi small{color:#666;display:block}.qi div{margin:6px 0;white-space:pre-wrap}
#qList{max-height:60vh;overflow:auto}
.pv table{border:1px solid #cfd6f5}.pv th,.pv td{border:1px solid #e1e5f7}.pv thead th{background:#3b5bdb;color:#fff;top:0}
.pv thead tr:nth-child(2) th{background:#5c7cfa;font-weight:400;font-size:12px;top:38px}
.pv tbody tr:nth-child(even){background:#f8f9ff}.pv .c1,.pv .c2{position:sticky;background:#fff;z-index:2}.pv .c1{left:0;min-width:36px}.pv .c2{left:36px;min-width:130px;box-shadow:2px 0 3px #0001}
.pv thead .c1,.pv thead .c2{background:#3b5bdb;z-index:3}.pv small{color:#888}.pv .mx{white-space:nowrap}
</style>
</head>
<body>
<header><h1 id="title">คะแนนงาน ม.3</h1><button class="btn light hide" id="logout">ออก</button></header>

<div id="login" class="card">
  <h2>กรอกรหัสเข้าใช้งาน</h2>
  <input id="code" inputmode="text" placeholder="เช่น 31" autocomplete="off">
  <button class="btn" id="go" style="width:100%">เข้าสู่ระบบ</button>
  <div class="msg" id="lmsg"></div>
</div>

<main id="app" class="hide"></main>
<div id="busy" class="hide" style="position:fixed;inset:0;background:#fff9;align-items:center;justify-content:center;z-index:99;font-size:20px">⏳ กำลังบันทึก...</div>

<dialog id="dlgNew"><h3>สร้างงานใหม่</h3>
  <label>ชื่องาน</label><input id="nTitle">
  <label>คะแนนเต็ม</label><input id="nMax" type="number" inputmode="numeric" value="10">
  <label>ห้อง</label><select id="nRooms"><option value="cur">ห้องที่เลือกอยู่</option><option value="all">ทุกห้อง</option></select>
  <p><button class="btn" id="nOk">สร้าง</button> <button class="btn light" id="nCancel">ยกเลิก</button></p></dialog>

<dialog id="dlgImp"><h3>นำเข้ารายชื่อ</h3>
  <p style="font-size:13px">วางจาก Excel: <b>เลขที่ [Tab/เว้นวรรค] ชื่อ-สกุล</b> บรรทัดละคน (จะแทนที่รายชื่อห้องนี้)</p>
  <textarea id="iText" rows="10"></textarea>
  <p><button class="btn" id="iOk">นำเข้า</button> <button class="btn light" id="iCancel">ยกเลิก</button></p></dialog>

<dialog id="dlgAsk"><h3>❓ สงสัยคะแนน / ถามครู</h3>
  <label>ชื่อของฉัน</label><select id="aWho"></select>
  <label>เกี่ยวกับงาน</label><select id="aAssign"></select>
  <label>ข้อความ</label><textarea id="aMsg" rows="5" maxlength="500" placeholder="เช่น หนูส่งงานแล้วแต่ยังไม่มีคะแนนค่ะ"></textarea>
  <p><button class="btn" id="aOk">ส่งถึงครู</button> <button class="btn light" id="aCancel">ยกเลิก</button></p></dialog>

<dialog id="dlgQ"><h3>💬 คำถามจากนักเรียน</h3><div id="qList"></div>
  <p><button class="btn light" id="qClose">ปิด</button></p></dialog>

<script>
// ===== ตั้งค่า: วาง URL Web App ของ Apps Script ที่นี่ =====
const API = 'https://script.google.com/macros/s/AKfycbz1jaxNrV66tOCv6BUDaMEO0BuwY4nfO8NVM9gnbB1ldQ3RNiPii9mNcIXQSNsJTcMi3Q/exec';

const $ = id => document.getElementById(id);
let code = '', role = '', room = '3/1', data = null, curAssign = null;

async function load(r) {
  const res = await fetch(`${API}?code=${encodeURIComponent(code)}&room=${encodeURIComponent(r || room)}`);
  return res.json();
}
async function post(body) {
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ code, ...body }) });
  const t = await res.text();
  let j; try { j = JSON.parse(t); } catch (e) { throw new Error('เซิร์ฟเวอร์ตอบผิดรูปแบบ (ต้อง Deploy เวอร์ชันใหม่ / ตั้งสิทธิ์ Anyone)'); }
  if (!j.ok) throw new Error(j.error || 'ผิดพลาด');
  return j;
}
function busy(on) { $('busy').classList.toggle('hide', !on); }
async function run(fn) {
  busy(true);
  try { await fn(); } catch (e) { alert('ไม่สำเร็จ: ' + e.message); } finally { busy(false); }
}

async function login(c) {
  $('lmsg').textContent = 'กำลังโหลด...';
  code = c.trim();
  try {
    const j = await load();
    if (!j.ok) { $('lmsg').textContent = j.error; return; }
    role = j.role; data = j.data; room = data.room;
    localStorage.setItem('code', code);
    $('login').classList.add('hide'); $('app').classList.remove('hide'); $('logout').classList.remove('hide');
    render();
  } catch (e) { $('lmsg').textContent = 'เชื่อมต่อไม่ได้ (ตรวจสอบ URL API)'; }
}

function fmt(v, max) {
  if (v === '' || v === undefined) return '<span class="miss">-</span>';
  if (typeof v === 'number') return `<span class="${v >= max * 0.5 ? 'ok' : 'late'}">${v}</span>`;
  return `<span class="miss">${v}</span>`;
}

function render() {
  $('title').textContent = role === 'teacher' ? 'โหมดครู' : 'คะแนนห้อง ม.' + room;
  role === 'teacher' ? renderTeacher() : renderStudent();
}

function renderStudent() {
  const { students, assignments, scores } = data;
  if (!students.length) { $('app').innerHTML = '<div class="card">ยังไม่มีรายชื่อ</div>'; return; }
  const totalMax = assignments.reduce((s, a) => s + a.max, 0);
  let h = `<div class="card"><input id="q" placeholder="🔍 ค้นหาชื่อ เช่น สุมาลี" autocomplete="off"><div id="sg"></div><div id="detail"></div>
  <p style="margin:10px 0 0"><button class="btn red" id="bAsk">❓ สงสัยคะแนน / ถามครู</button></p></div>
  <div class="card"><h3 style="margin:0 0 8px">ตารางคะแนน ม.${room}</h3>
  <div class="tbl pv"><table><thead><tr><th rowspan="2" class="c1">ที่</th><th rowspan="2" class="c2">ชื่อ-สกุล</th>` +
    assignments.map(a => `<th>${a.title}</th>`).join('') + `<th rowspan="2">รวม</th><th rowspan="2">%</th></tr><tr>` +
    assignments.map(a => `<th class="mx">เต็ม ${a.max}</th>`).join('') + '</tr></thead><tbody>';
  students.forEach(s => {
    let sum = 0;
    const cells = assignments.map(a => { const v = scores[s.number + '|' + a.id]; if (typeof v === 'number') sum += v; return `<td>${fmt(v, a.max)}</td>`; }).join('');
    const pct = totalMax ? Math.round(sum * 100 / totalMax) : 0;
    h += `<tr data-s="${s.number} ${s.name}"><td class="c1">${s.number}</td><td class="n c2">${s.name}</td>${cells}<td><b>${sum}</b><small>/${totalMax}</small></td><td>${pct}%</td></tr>`;
  });
  $('app').innerHTML = h + '</tbody></table></div></div>';
  let picked = null;
  const filterRows = v => document.querySelectorAll('tr[data-s]').forEach(tr => tr.classList.toggle('hide', !tr.dataset.s.toLowerCase().includes(v.toLowerCase())));
  const showDetail = s => {
    let sum = 0;
    const rows = assignments.map(a => { const v = scores[s.number + '|' + a.id]; if (typeof v === 'number') sum += v; return `<tr><td class="n">${esc(a.title)}</td><td>${fmt(v, a.max)}</td><td>${a.max}</td></tr>`; }).join('');
    $('detail').innerHTML = `<div class="detail"><b>${s.number}. ${esc(s.name)}</b> — รวม <b>${sum}</b>/${totalMax}
      <table><tr><th>งาน</th><th>ได้</th><th>เต็ม</th></tr>${rows}</table></div>`;
  };
  $('q').oninput = e => {
    const v = e.target.value.trim(); picked = null; $('detail').innerHTML = '';
    filterRows(v);
    const m = v ? students.filter(s => (s.number + ' ' + s.name).toLowerCase().includes(v.toLowerCase())).slice(0, 8) : [];
    $('sg').innerHTML = m.map(s => `<button class="sgi" data-n="${s.number}">${s.number}. ${esc(s.name)}</button>`).join('');
    document.querySelectorAll('.sgi').forEach(b => b.onclick = () => {
      picked = students.find(s => s.number === Number(b.dataset.n));
      $('q').value = picked.name; $('sg').innerHTML = ''; filterRows(picked.number + ' ' + picked.name); showDetail(picked);
    });
  };
  $('bAsk').onclick = () => openAsk(picked, students, assignments);
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function openAsk(picked, students, assignments) {
  $('aWho').innerHTML = '<option value="">— เลือกชื่อของฉัน —</option>' + students.map(s => `<option value="${s.number}" ${picked && picked.number === s.number ? 'selected' : ''}>${s.number}. ${esc(s.name)}</option>`).join('');
  $('aAssign').innerHTML = '<option value="">ทั่วไป / ไม่ระบุงาน</option>' + assignments.map(a => `<option>${esc(a.title)}</option>`).join('');
  $('aMsg').value = ''; $('dlgAsk').showModal();
}
$('aCancel').onclick = () => $('dlgAsk').close();
$('aOk').onclick = () => {
  const message = $('aMsg').value.trim(); if (!message) return alert('กรุณาพิมพ์ข้อความ');
  const sel = $('aWho').selectedOptions[0];
  const number = $('aWho').value, name = number ? sel.textContent.replace(/^\d+\.\s*/, '') : '';
  const assignment = $('aAssign').value;
  $('dlgAsk').close();
  run(async () => { await post({ action: 'ask', number, name, assignment, message }); alert('ส่งข้อความถึงคุณครูแล้ว ✅'); });
};

// ===== ฝั่งครู: ดูคำถามจากนักเรียน =====
async function openQuestions() {
  $('qList').innerHTML = 'กำลังโหลด...'; $('dlgQ').showModal();
  try {
    const res = await fetch(`${API}?code=${encodeURIComponent(code)}&action=questions`); const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    $('qList').innerHTML = j.questions.length ? j.questions.map(q => `<div class="qi ${q.status === 'ใหม่' ? 'new' : ''}">
      <small>${new Date(q.time).toLocaleString('th-TH')} • ม.${esc(q.room)} ${q.number ? '• ' + esc(q.number + '. ' + q.name) : ''} ${q.assignment ? '• ' + esc(q.assignment) : ''}</small>
      <div>${esc(q.message)}</div>
      <button class="q" data-id="${q.id}" data-st="${q.status === 'ใหม่' ? 'ตอบแล้ว' : 'ใหม่'}">${q.status === 'ใหม่' ? '✔ ทำเครื่องหมายว่าตอบแล้ว' : '↩ ตอบแล้ว (กดเพื่อเปิดใหม่)'}</button></div>`).join('') : 'ยังไม่มีคำถาม';
    document.querySelectorAll('#qList button').forEach(b => b.onclick = async () => {
      b.disabled = true; try { await post({ action: 'markQuestion', id: b.dataset.id, status: b.dataset.st }); } catch (e) { alert(e.message); }
      openQuestions(); countQuestions();
    });
  } catch (e) { $('qList').textContent = 'โหลดไม่สำเร็จ: ' + e.message; }
}
async function countQuestions() {
  try {
    const j = await (await fetch(`${API}?code=${encodeURIComponent(code)}&action=questions`)).json();
    const n = j.questions.filter(q => q.status === 'ใหม่').length;
    const b = $('bQ'); if (b) b.textContent = '💬 คำถามนักเรียน' + (n ? ` (${n})` : '');
  } catch (e) {}
}
$('qClose').onclick = () => $('dlgQ').close();

function renderTeacher() {
  const { students, assignments, scores } = data;
  if (!curAssign || !assignments.find(a => a.id === curAssign)) curAssign = assignments[0]?.id || null;
  const a = assignments.find(x => x.id === curAssign);
  let h = '<div class="card"><div class="chips">' + Array.from({ length: 10 }, (_, i) => `3/${i + 1}`)
    .map(r => `<button class="chip ${r === room ? 'on' : ''}" data-room="${r}">${r}</button>`).join('') + '</div>' +
    `<p><button class="btn" id="bNew">+ สร้างงาน</button> <button class="btn light" id="bImp">นำเข้ารายชื่อ</button> <button class="btn light" id="bQ">💬 คำถามนักเรียน</button></p>` +
    `<select id="selA">${assignments.map(x => `<option value="${x.id}" ${x.id === curAssign ? 'selected' : ''}>${x.title} (เต็ม ${x.max})</option>`).join('')}</select>` +
    (a ? ` <p><button class="btn red" id="bDel">ลบงานนี้</button></p>` : '') + '</div>';
  if (a) {
    h += '<div class="card"><input id="q" placeholder="ค้นหา"><div id="list">' + students.map(s => {
      const v = scores[s.number + '|' + a.id];
      return `<div class="row" data-s="${s.number} ${s.name}"><div class="nm">${s.number}. ${s.name}</div>
      <input inputmode="decimal" data-n="${s.number}" value="${v ?? ''}" placeholder="-">
      <button class="q" data-n="${s.number}" data-v="${a.max}">เต็ม</button><button class="q" data-n="${s.number}" data-v="ขาด">ขาด</button></div>`;
    }).join('') + '</div></div>';
  } else h += '<div class="card">ยังไม่มีงาน กด "+ สร้างงาน"</div>';
  $('app').innerHTML = h;

  document.querySelectorAll('[data-room]').forEach(b => b.onclick = async () => { room = b.dataset.room; data = (await load(room)).data; render(); });
  $('bNew').onclick = () => { $('nRooms').options[0].textContent = 'ม.' + room + ' (ห้องนี้เท่านั้น)'; $('nRooms').value = 'cur'; $('dlgNew').showModal(); };
  $('bImp').onclick = () => $('dlgImp').showModal();
  $('bQ').onclick = openQuestions; countQuestions();
  if (!a) return;
  $('selA').onchange = e => { curAssign = e.target.value; render(); };
  $('bDel').onclick = () => { if (confirm('ลบงานนี้ (คะแนนจะไม่แสดง)?')) run(async () => { await post({ action: 'deleteAssignment', id: a.id }); data = (await load()).data; render(); }); };
  $('q').oninput = e => document.querySelectorAll('.row').forEach(r => r.classList.toggle('hide', !r.dataset.s.includes(e.target.value)));
  document.querySelectorAll('.row input').forEach(inp => inp.onchange = () => save(inp, inp.value));
  document.querySelectorAll('button.q').forEach(b => b.onclick = () => { const inp = document.querySelector(`input[data-n="${b.dataset.n}"]`); inp.value = b.dataset.v; save(inp, b.dataset.v); });
}

async function save(inp, raw) {
  raw = String(raw).trim();
  const score = raw === '' ? '' : (isNaN(Number(raw)) ? raw : Number(raw));
  const number = Number(inp.dataset.n);
  const max = data.assignments.find(a => a.id === curAssign)?.max;
  if (typeof score === 'number' && (score > max || score < 0)) {
    alert(`⚠️ คะแนน ${score} ไม่ถูกต้อง\nคะแนนต้องอยู่ระหว่าง 0 – ${max} (คะแนนเต็ม ${max})`);
    inp.value = data.scores[number + '|' + curAssign] ?? '';
    inp.classList.add('err');
    inp.focus();
    return;
  }
  inp.classList.remove('saved', 'err');
  try {
    const j = await post({ action: 'setScore', room, number, assignmentId: curAssign, score });
    if (!j.ok) throw 0;
    data.scores[number + '|' + curAssign] = score;
    inp.classList.add('saved');
  } catch (e) { inp.classList.add('err'); }
}

$('go').onclick = () => login($('code').value);
$('code').onkeydown = e => { if (e.key === 'Enter') login($('code').value); };
$('logout').onclick = () => { localStorage.removeItem('code'); location.reload(); };
$('nCancel').onclick = () => $('dlgNew').close();
$('iCancel').onclick = () => $('dlgImp').close();
$('nOk').onclick = () => {
  const title = $('nTitle').value.trim(); if (!title) return alert('กรุณาใส่ชื่องาน');
  const max = Number($('nMax').value) || 10, rooms = $('nRooms').value === 'all' ? 'all' : room;
  $('dlgNew').close();
  run(async () => {
    await post({ action: 'createAssignment', title, max, rooms });
    $('nTitle').value = ''; data = (await load()).data; curAssign = data.assignments.at(-1)?.id; render();
  });
};
$('iOk').onclick = () => {
  const list = $('iText').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = /^(\d+)[\s\t.]+(.+)$/.exec(l); return m ? { number: Number(m[1]), name: m[2].trim() } : null;
  }).filter(Boolean);
  if (!list.length) return alert('รูปแบบไม่ถูกต้อง (ต้องเป็น: เลขที่ ชื่อ-สกุล)');
  $('dlgImp').close();
  run(async () => {
    await post({ action: 'importStudents', room, list });
    $('iText').value = ''; data = (await load()).data; render();
  });
};
const saved = localStorage.getItem('code'); if (saved) { $('code').value = saved; login(saved); }
</script>
</body>
</html>
