<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - สถิติการเข้าเรียน</title>
    
    <!-- ฟอนต์ TH Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- ไลบรารีที่จำเป็น -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary);
            margin: 0;
            padding: 20px;
            font-size: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ================= ระบบล็อคอิน (Login Overlay) ================= */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95); /* พื้นหลังทึบ */
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 12px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-box h2 { margin-top: 0; color: var(--primary); font-size: 32px; }
        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 1px solid #bdc3c7; border-radius: 6px;
            box-sizing: border-box; font-size: 20px; font-family: 'Sarabun';
        }
        .login-box button {
            width: 100%; padding: 15px; margin-top: 15px;
            background: var(--accent); color: white; border: none;
            border-radius: 6px; font-size: 22px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        .login-box button:hover { background: #2980b9; }

        /* ส่วนหัวและตัวกรอง */
        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header-title h1 { margin: 0; font-size: 32px; }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="date"] {
            padding: 10px;
            font-size: 20px;
            font-family: 'Sarabun', sans-serif;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button.control-btn {
            padding: 10px 20px;
            font-size: 20px;
            font-family: 'Sarabun', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn-load { background-color: var(--accent); color: white; }
        .btn-excel { background-color: var(--success); color: white; }
        .btn-nav { background-color: #7f8c8d; color: white; }
        .btn-logout { background-color: var(--danger); color: white; }
        
        button.control-btn:hover { opacity: 0.9; }

        /* พื้นที่กราฟ */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .chart-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }
        .chart-card h2 { margin-top: 0; font-size: 26px; color: var(--secondary); }
        .chart-container { position: relative; height: 350px; width: 100%; }

        /* การปรับแต่ง SweetAlert สำหรับแสดงตารางรายชื่อ */
        .swal-table-container {
            max-height: 400px;
            overflow-y: auto;
            text-align: left;
        }
        .swal-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 20px;
        }
        .swal-table th, .swal-table td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        .swal-table th { background-color: #f8f9fa; position: sticky; top: 0; }

        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ================= หน้าจอ Login ================= -->
    <div id="auth-overlay">
        <div class="login-box">
            <h2>🔐 ผู้ดูแลระบบ</h2>
            <p style="color: #7f8c8d; font-size: 18px; margin-top: -10px;">กรุณาเข้าสู่ระบบเพื่อดูรายงาน</p>
            <input type="email" id="adminEmail" placeholder="อีเมล">
            <input type="password" id="adminPassword" placeholder="รหัสผ่าน">
            <button onclick="checkAuth()">เข้าสู่ระบบ</button>
        </div>
    </div>
    <!-- ============================================= -->

    <div class="container">
        <!-- ส่วนหัวและเครื่องมือ -->
        <div class="header">
            <div class="header-title">
                <h1>📊 รายงานสถิติการเข้าเรียน</h1>
                <div style="font-size: 20px; color: #ecf0f1;">ระบบสแกนใบหน้า Buayai I Care School</div>
            </div>
            
            <div class="controls">
                <label for="datePicker" style="font-weight: bold;">เลือกวันที่:</label>
                <input type="date" id="datePicker">
                <button class="control-btn btn-load" onclick="loadDashboardData()">ดูข้อมูล</button>
                <button class="control-btn btn-excel" onclick="exportToExcel()">📥 โหลด Excel</button>
                <button class="control-btn btn-nav" onclick="window.location.href='scan1024.html'">หน้าสแกน</button>
                <button class="control-btn btn-logout" onclick="logout()">ออกจากระบบ</button>
            </div>
        </div>

        <!-- กราฟ -->
        <div class="charts-grid">
            <div class="chart-card">
                <h2>✅ จำนวนนักเรียนที่ "มาเรียน" (แยกตามระดับชั้น)</h2>
                <div class="chart-container">
                    <canvas id="presentChart"></canvas>
                </div>
                <p style="color: #7f8c8d; font-size: 16px;">* คลิกที่แท่งกราฟเพื่อดูรายละเอียดรายห้อง</p>
            </div>

            <div class="chart-card">
                <h2>❌ จำนวนนักเรียนที่ "ยังไม่มา" (แยกตามระดับชั้น)</h2>
                <div class="chart-container">
                    <canvas id="absentChart"></canvas>
                </div>
                <p style="color: #7f8c8d; font-size: 16px;">* คลิกที่แท่งกราฟเพื่อดูรายชื่อนักเรียน</p>
            </div>
        </div>
    </div>

    <!-- สคริปต์การทำงาน -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 1. ตั้งค่า Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDKUdsm370QMPICz-ap4RLip3eqM5rkFY8",
            authDomain: "by-fscan.firebaseapp.com",
            projectId: "by-fscan",
            storageBucket: "by-fscan.firebasestorage.app",
            messagingSenderId: "557564109653",
            appId: "1:557564109653:web:3459229f1b539cf25285dc"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app); // ระบบ Auth

        let presentChartInstance = null;
        let absentChartInstance = null;
        let allStudents = []; 
        let presentStudentsByDate = [];
        let absentStudentsByDate = [];

        // ==========================================
        // ระบบ Authentication (ตรวจจับสถานะการล็อกอิน)
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ถ้าล็อคอินแล้ว ให้ซ่อนหน้ากาก แล้วโหลดข้อมูลกราฟ
                document.getElementById('auth-overlay').style.display = 'none';
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('datePicker').value = today;
                window.loadDashboardData(); 
            } else {
                // ถ้ายังไม่ล็อคอิน ให้แสดงหน้าจอให้กรอกรหัสผ่าน
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        });

        window.checkAuth = function() {
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPassword').value;

            if(email === '' || pass === '') {
                return Swal.fire('แจ้งเตือน', 'กรุณากรอกอีเมลและรหัสผ่าน', 'warning');
            }

            Swal.fire({ title: 'กำลังตรวจสอบสิทธิ์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            signInWithEmailAndPassword(auth, email, pass)
                .then(() => { Swal.close(); }) // สำเร็จ onAuthStateChanged จะจัดการต่อ
                .catch(() => Swal.fire('ล้มเหลว', 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'error'));
        };

        window.logout = function() {
            Swal.fire({
                title: 'ยืนยันการออกจากระบบ?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                confirmButtonText: 'ออกจากระบบ',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    signOut(auth).then(() => {
                        // ลบกราฟทิ้งตอนออกจากระบบ เพื่อความปลอดภัย
                        if(presentChartInstance) presentChartInstance.destroy();
                        if(absentChartInstance) absentChartInstance.destroy();
                    });
                }
            });
        };

        // ==========================================
        // ฟังก์ชันโหลดและประมวลผลข้อมูล
        // ==========================================
        window.loadDashboardData = async function() {
            const selectedDate = document.getElementById('datePicker').value;
            if(!selectedDate) return;

            Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                // โหลดชื่อนักเรียนจาก Google Sheet
                if (allStudents.length === 0) {
                    const gasUrl = 'https://script.google.com/macros/s/AKfycbyjgfLVdbMWnEEntotJ8w2O9StmJKfj5-CdN-NRnsWufmty25QwGPdrAm6dlXVaK-xbLQ/exec';
                    const response = await fetch(gasUrl);
                    const data = await response.json();
                    
                    allStudents = data.map(student => {
                        const roomStr = student['ชั้น'] || ''; 
                        const gradeStr = roomStr.includes('/') ? roomStr.split('/')[0] : roomStr; 
                        
                        return {
                            studentId: String(student['ID']).trim(),
                            name: student['ชื่อ-สกุล'] || 'ไม่ระบุชื่อ',
                            grade: gradeStr || 'ไม่ระบุ',
                            room: roomStr || 'ไม่ระบุ',
                            isActive: true
                        };
                    });
                }

                // โหลดข้อมูลการสแกนจาก Firebase
                const startDate = new Date(selectedDate + "T00:00:00");
                const endDate = new Date(selectedDate + "T23:59:59");

                const logsRef = collection(db, "scan_logs");
                const q = query(logsRef, where("timestamp", ">=", startDate), where("timestamp", "<=", endDate));
                const logsSnap = await getDocs(q);

                const scannedIds = new Set();
                logsSnap.forEach(doc => {
                    const docData = doc.data();
                    if(docData.studentId) scannedIds.add(String(docData.studentId).trim());
                });

                presentStudentsByDate = [];
                absentStudentsByDate = [];

                allStudents.forEach(student => {
                    if (scannedIds.has(student.studentId)) {
                        presentStudentsByDate.push(student);
                    } else {
                        absentStudentsByDate.push(student);
                    }
                });

                const uniqueGradesSet = new Set(allStudents.map(s => s.grade).filter(g => g !== 'ไม่ระบุ'));
                const grades = Array.from(uniqueGradesSet).sort(); 

                const presentData = grades.map(g => presentStudentsByDate.filter(s => s.grade === g).length);
                const absentData = grades.map(g => absentStudentsByDate.filter(s => s.grade === g).length);

                renderCharts(grades, presentData, absentData);
                Swal.close();

            } catch (error) {
                console.error(error);
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
            }
        };

        // ==========================================
        // ฟังก์ชันวาดกราฟ (Chart.js)
        // ==========================================
        function renderCharts(labels, presentData, absentData) {
            if(presentChartInstance) presentChartInstance.destroy();
            if(absentChartInstance) absentChartInstance.destroy();

            const ctxPresent = document.getElementById('presentChart').getContext('2d');
            presentChartInstance = new Chart(ctxPresent, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'จำนวนคนมาเรียน',
                        data: presentData,
                        backgroundColor: '#27ae60',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const gradeIndex = elements[0].index;
                            showPresentDetails(labels[gradeIndex]);
                        }
                    }
                }
            });

            const ctxAbsent = document.getElementById('absentChart').getContext('2d');
            absentChartInstance = new Chart(ctxAbsent, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'จำนวนคนที่ยังไม่มา',
                        data: absentData,
                        backgroundColor: '#e74c3c',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const gradeIndex = elements[0].index;
                            showAbsentDetails(labels[gradeIndex]);
                        }
                    }
                }
            });
        }

        // ==========================================
        // ฟังก์ชันแสดงรายละเอียด
        // ==========================================
        function showPresentDetails(grade) {
            const studentsInGrade = presentStudentsByDate.filter(s => s.grade === grade);
            const roomSummary = {};
            studentsInGrade.forEach(s => {
                roomSummary[s.room] = (roomSummary[s.room] || 0) + 1;
            });

            const sortedRooms = Object.keys(roomSummary).sort();
            let tableHTML = `<div class="swal-table-container"><table class="swal-table"><thead><tr><th>ชั้น/ห้อง</th><th>จำนวนที่มาแล้ว (คน)</th></tr></thead><tbody>`;
            sortedRooms.forEach(room => { tableHTML += `<tr><td>${room}</td><td>${roomSummary[room]}</td></tr>`; });
            tableHTML += `</tbody></table></div>`;

            Swal.fire({ title: `สถิติมาเรียนระดับชั้น ${grade}`, html: tableHTML, width: '600px', confirmButtonText: 'ปิด', confirmButtonColor: '#2c3e50' });
        }

        function showAbsentDetails(grade) {
            const studentsInGrade = absentStudentsByDate.filter(s => s.grade === grade);
            studentsInGrade.sort((a, b) => a.room.localeCompare(b.room) || a.studentId.localeCompare(b.studentId));

            let tableHTML = `<div class="swal-table-container"><table class="swal-table"><thead><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>ชั้น</th></tr></thead><tbody>`;
            studentsInGrade.forEach(s => { tableHTML += `<tr><td>${s.studentId}</td><td>${s.name}</td><td>${s.room}</td></tr>`; });
            tableHTML += `</tbody></table></div>`;

            Swal.fire({ title: `รายชื่อผู้ที่ยังไม่มา (${grade})<br><span style="font-size:18px; color:red;">รวม ${studentsInGrade.length} คน</span>`, html: tableHTML, width: '700px', confirmButtonText: 'ปิด', confirmButtonColor: '#2c3e50' });
        }

        // ==========================================
        // ฟังก์ชันส่งออก Excel (SheetJS)
        // ==========================================
        window.exportToExcel = function() {
            const selectedDate = document.getElementById('datePicker').value;
            if (presentStudentsByDate.length === 0 && absentStudentsByDate.length === 0) {
                Swal.fire('ไม่มีข้อมูล', 'ไม่พบข้อมูลสำหรับส่งออกในวันที่เลือก', 'warning');
                return;
            }

            const presentData = presentStudentsByDate.map(s => ({
                "รหัสนักเรียน": s.studentId, "ชื่อ-สกุล": s.name, "ระดับชั้น": s.grade, "ห้อง": s.room, "สถานะ": "มาเรียน"
            }));

            const absentData = absentStudentsByDate.map(s => ({
                "รหัสนักเรียน": s.studentId, "ชื่อ-สกุล": s.name, "ระดับชั้น": s.grade, "ห้อง": s.room, "สถานะ": "ยังไม่มาเรียน"
            }));

            const wb = XLSX.utils.book_new();
            if (presentData.length > 0) {
                const wsPresent = XLSX.utils.json_to_sheet(presentData);
                XLSX.utils.book_append_sheet(wb, wsPresent, "รายชื่อผู้ที่มาเรียน");
            }
            if (absentData.length > 0) {
                const wsAbsent = XLSX.utils.json_to_sheet(absentData);
                XLSX.utils.book_append_sheet(wb, wsAbsent, "รายชื่อผู้ที่ขาดเรียน");
            }

            XLSX.writeFile(wb, `รายงานการเข้าเรียน_${selectedDate}.xlsx`);
        };
    </script>
</body>
</html>
