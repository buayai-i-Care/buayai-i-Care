<script>
// 1. ตั้งค่าเส้นทางเดินเอกสาร (Workflow Rules)
// ระบบจะเช็คว่าใครล็อคอิน และจะแสดงปุ่มก็ต่อเมื่อสถานะงานตรงกับที่ตั้งไว้
const WORKFLOW_RULES = {
    'u2': { 
        canProcess: 'STEP_2', // u2 จะเห็นปุ่มเมื่อสถานะงานคือ STEP_2 (รอ 14 แผ่น)
        onProceed: { status: 'STEP_3', actionText: 'ส่งต่อให้ รองธานินท์' },
        onReturn: { status: 'RETURN_1', actionText: 'ส่งคืนให้ ครูผู้สร้างงาน (t)' }
    },
    'u3': { 
        canProcess: 'STEP_3', // u3 จะเห็นปุ่มเมื่อสถานะงานคือ STEP_3 (รอรองธานินท์)
        onProceed: { status: 'STEP_4', actionText: 'ส่งต่อให้ ส่งของตรวจรับ' },
        onReturn: { status: 'RETURN_2', actionText: 'ส่งคืนให้ 14 แผ่น' }
    },
    'u4': { 
        canProcess: 'STEP_4', // u4 จะเห็นปุ่มเมื่อสถานะงานคือ STEP_4 (รอส่งของตรวจรับ)
        onProceed: { status: 'STEP_5', actionText: 'ส่งต่อให้ การเงิน' },
        onReturn: { status: 'RETURN_3', actionText: 'ส่งคืนให้ รองธานินท์' }
    },
    'u5': { 
        canProcess: 'STEP_5', // u5 จะเห็นปุ่มเมื่อสถานะงานคือ STEP_5 (รอการเงิน)
        onProceed: { status: 'STEP_6', actionText: 'ออกเช็คจ่ายเงิน (เสร็จสิ้น)' },
        onReturn: { status: 'RETURN_4', actionText: 'ส่งคืนให้ ส่งของตรวจรับ' }
    }
};

let currentSelectedTask = null; // เก็บข้อมูลงานที่กำลังเปิดดู

// 2. ฟังก์ชันตรวจสอบเพื่อแสดงปุ่มเมื่อผู้ใช้กดดูรายละเอียดงาน
function checkAndShowButtons(taskStatus) {
    const actionContainer = document.getElementById('action-buttons-container');
    const currentUser = localStorage.getItem('username') || ''; // ดึงชื่อผู้ใช้ที่ล็อคอิน เช่น u3

    // ซ่อนปุ่มไว้ก่อนเป็นค่าเริ่มต้น
    actionContainer.classList.add('hidden'); 

    // เช็คว่า User ที่ล็อคอินมีอยู่ในกฎหรือไม่ และสถานะงานตรงกับหน้าที่เขาไหม
    if (WORKFLOW_RULES[currentUser] && WORKFLOW_RULES[currentUser].canProcess === taskStatus) {
        // ถ้าตรงกัน ให้แสดงกล่องปุ่มขึ้นมา
        actionContainer.classList.remove('hidden');
    }
}

// 3. ฟังก์ชันเมื่อเจ้าหน้าที่กดปุ่ม "เรียบร้อยดำเนินต่อไปได้" หรือ "ส่งคืน"
async function processTask(actionType) {
    const currentUser = localStorage.getItem('username');
    const rule = WORKFLOW_RULES[currentUser];
    
    if (!rule) {
        alert("ไม่มีสิทธิ์ดำเนินการในขั้นตอนนี้");
        return;
    }

    // กำหนดสถานะใหม่และข้อความที่จะบันทึกลง Timeline ตามปุ่มที่กด
    let newStatus = '';
    let actionMessage = '';

    if (actionType === 'proceed') {
        newStatus = rule.onProceed.status;
        actionMessage = rule.onProceed.actionText;
    } else if (actionType === 'return') {
        newStatus = rule.onReturn.status;
        actionMessage = rule.onReturn.actionText;
    }

    // แจ้งให้ผู้ใช้กรอก Note สั้นๆ (ไม่บังคับ)
    const note = prompt(`กำลังจะ${actionMessage}\nคุณสามารถพิมพ์หมายเหตุเพิ่มเติมได้ (ถ้ามี):`, "") || "-";

    // ... (ส่วนนี้คือโค้ดที่คุณต้องนำตัวแปร newStatus, actionMessage, note ส่ง API ไปที่ Google Sheets ต่อไป) ...
    console.log(`[จำลองการส่ง API] ส่งงาน: ${currentSelectedTask.TaskID} ไปสถานะ: ${newStatus}, หมายเหตุ: ${note}`);
    
    alert(`ดำเนินการสำเร็จ! ${actionMessage}`);
    // ปิดหน้าต่างรายละเอียดและรีเฟรชรายการงาน
    // closeDetailModal();
    // loadTasks(); 
}
