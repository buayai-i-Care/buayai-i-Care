<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แดชบอร์ดสรุปการลงเวลาเรียน โรงเรียนบัวใหญ่ องค์การบริหารส่วนจังหวัดนครราชสีมา (Real-time)</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 20px; 
            color: #333;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        
        h2 { text-align: center; color: #1a252f; margin-bottom: 20px; }

        /* Summary Cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
            border-bottom: 4px solid #007bff;
        }
        .card.total { border-color: #28a745; }
        .card.g1 { border-color: #17a2b8; }
        .card.g2 { border-color: #ffc107; }
        .card.g3 { border-color: #fd7e14; }
        .card.g4 { border-color: #6f42c1; }
        
        .card h4 { margin: 0; color: #6c757d; font-size: 0.9rem; }
        .card .number { font-size: 1.8rem; font-weight: bold; margin-top: 5px; color: #212529; }

        /* Controls Section */
        .controls {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        input[type="date"], select, input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .btn-export {
            background-color: #28a745;
            color: #fff;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-export:hover { background-color: #218838; }

        /* Data Table */
        .table-container {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td { padding: 12px 15px; border-bottom: 1px solid #e9ecef; }
        th { background-color: #f8f9fa; color: #495057; font-weight: 600; }
        tr:hover { background-color: #f1f3f5; }
        
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .badge-success { background-color: #d4edda; color: #155724; }
        .badge-gate { background-color: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 แดชบอร์ดสรุปการลงเวลาเรียน  โรงเรียนบัวใหญ่ องค์การบริหารส่วนจังหวัดนครราชสีมา </h2>

    <!-- การ์ดสรุปยอด -->
    <div class="card-grid">
        <div class="card total">
            <h4>มาเรียนวันนี้ทั้งหมด</h4>
            <div class="number" id="countTotal">0</div>
        </div>
        <div class="card g1">
            <h4>ประตู 1</h4>
            <div class="number" id="countG1">0</div>
        </div>
        <div class="card g2">
            <h4>ประตู 2</h4>
            <div class="number" id="countG2">0</div>
        </div>
        <div class="card g3">
            <h4>ประตู 3</h4>
            <div class="number" id="countG3">0</div>
        </div>
        <div class="card g4">
            <h4>ประตู 4</h4>
            <div class="number" id="countG4">0</div>
        </div>
    </div>

    <!-- ตัวกรองข้อมูล -->
    <div class="controls">
        <div class="filter-group">
            <label><strong>วันที่:</strong></label>
            <input type="date" id="dateFilter">

            <select id="gateFilter">
                <option value="ALL">ทุกประตู (Gate All)</option>
                <option value="Gate 1">ประตู 1</option>
                <option value="Gate 2">ประตู 2</option>
                <option value="Gate 3">ประตู 3</option>
                <option value="Gate 4">ประตู 4</option>
            </select>

            <input type="text" id="searchInput" placeholder="ค้นหารหัส หรือชื่อนักเรียน...">
        </div>

        <button class="btn-export" onclick="exportToCSV()">📥 Export Excel (CSV)</button>
    </div>

    <!-- ตารางแสดงรายการ -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>เวลาสแกน</th>
                    <th>รหัสนักเรียน</th>
                    <th>ชื่อ - นามสกุล</th>
                    <th>จุดสแกน</th>
                    <th>สถานะ</th>
                </tr>
            </thead>
            <tbody id="attendanceTable">
                <tr>
                    <td colspan="6" style="text-align: center; color: #888;">กำลังโหลดข้อมูล...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    // 1. Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDdwhcIqbbSkK0MmGcVpyrzR8bW3TBLSMM",
        authDomain: "by-school-fscan.firebaseapp.com",
        projectId: "by-school-fscan",
        storageBucket: "by-school-fscan.firebasestorage.app",
        messagingSenderId: "577646754945",
        appId: "1:577646754945:web:32aa72f9f66fd40d512180"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // DOM Elements
    const dateFilter = document.getElementById('dateFilter');
    const gateFilter = document.getElementById('gateFilter');
    const searchInput = document.getElementById('searchInput');
    const attendanceTable = document.getElementById('attendanceTable');

    let allRecords = []; // เก็บข้อมูลดิบประจำวัน
    let unsubscribe = null; // สำหรับยกเลิก Real-time listener เดิมเมื่อเปลี่ยนวันที่

    // ตั้งค่าวันที่เริ่มต้นเป็น "วันนี้"
    const todayStr = new Date().toISOString().split('T')[0];
    dateFilter.value = todayStr;

    // 2. ฟังข้อมูลการลงเวลาแบบ Real-time (onSnapshot)
    function listenAttendance(date) {
        if (unsubscribe) unsubscribe(); // ยกเลิกการดึงข้อมูลของวันก่อนหน้า

        attendanceTable.innerHTML = '<tr><td colspan="6" style="text-align: center;">กำลังดึงข้อมูล...</td></tr>';

        unsubscribe = db.collection("attendance")
            .where("date", "==", date)
            .onSnapshot(snapshot => {
                allRecords = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    
                    // แปลง Timestamp เป็นรูปแบบเวลา (HH:mm:ss)
                    let timeStr = "-";
                    if (data.timestamp) {
                        const dateObj = data.timestamp.toDate();
                        timeStr = dateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    }

                    allRecords.push({
                        id: doc.id,
                        studentId: data.studentId || '-',
                        fullName: data.fullName || '-',
                        gate: data.gate || 'Gate 1',
                        status: data.status || 'PRESENT',
                        timeStr: timeStr,
                        rawTimestamp: data.timestamp ? data.timestamp.toMillis() : 0
                    });
                });

                // เรียงลำดับเอาคนที่สแกนล่าสุดขึ้นก่อน
                allRecords.sort((a, b) => b.rawTimestamp - a.rawTimestamp);

                // อัปเดตการ์ดสรุปยอด และตาราง
                updateCounters();
                renderTable();
            }, err => {
                console.error("Error listening to attendance:", err);
                attendanceTable.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">เกิดข้อผิดพลาด: ${err.message}</td></tr>`;
            });
    }

    // 3. คำนวณยอดการ์ดสรุปผล
    function updateCounters() {
        document.getElementById('countTotal').innerText = allRecords.length;
        document.getElementById('countG1').innerText = allRecords.filter(r => r.gate === 'Gate 1').length;
        document.getElementById('countG2').innerText = allRecords.filter(r => r.gate === 'Gate 2').length;
        document.getElementById('countG3').innerText = allRecords.filter(r => r.gate === 'Gate 3').length;
        document.getElementById('countG4').innerText = allRecords.filter(r => r.gate === 'Gate 4').length;
    }

    // 4. แสดงผลตารางตาม Filter & Search
    function renderTable() {
        const selectedGate = gateFilter.value;
        const searchKeyword = searchInput.value.toLowerCase().trim();

        const filtered = allRecords.filter(record => {
            const matchGate = (selectedGate === 'ALL') || (record.gate === selectedGate);
            const matchSearch = record.studentId.toLowerCase().includes(searchKeyword) || 
                                record.fullName.toLowerCase().includes(searchKeyword);
            return matchGate && matchSearch;
        });

        if (filtered.length === 0) {
            attendanceTable.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888;">ไม่พบข้อมูลการสแกน</td></tr>';
            return;
        }

        let html = '';
        filtered.forEach((rec, index) => {
            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${rec.timeStr}</strong></td>
                    <td>${rec.studentId}</td>
                    <td>${rec.fullName}</td>
                    <td><span class="badge badge-gate">${rec.gate}</span></td>
                    <td><span class="badge badge-success">มาเรียน</span></td>
                </tr>
            `;
        });
        attendanceTable.innerHTML = html;
    }

    // 5. ส่งออกไฟล์ Excel (CSV)
    function exportToCSV() {
        if (allRecords.length === 0) {
            alert("ไม่มีข้อมูลสำหรับส่งออก");
            return;
        }

        // ใส่ \uFEFF ด้านหน้าเพื่อให้ Excel เปิดภาษาไทยได้อย่างถูกต้องไม่เป็นตัวต่างดาว
        let csvContent = "\uFEFFลำดับ,เวลาสแกน,รหัสนักเรียน,ชื่อ-นามสกุล,จุดสแกน,สถานะ\n";

        allRecords.forEach((rec, index) => {
            csvContent += `"${index + 1}","${rec.timeStr}","${rec.studentId}","${rec.fullName}","${rec.gate}","${rec.status}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `รายงานการเข้าเรียน_${dateFilter.value}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Event Listeners สำหรับ Filters
    dateFilter.addEventListener('change', (e) => listenAttendance(e.target.value));
    gateFilter.addEventListener('change', renderTable);
    searchInput.addEventListener('input', renderTable);

    // เริ่มต้นดึงข้อมูลของวันปัจจุบัน
    listenAttendance(todayStr);
</script>

</body>
</html>
