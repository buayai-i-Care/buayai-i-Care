<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุปผล - Buayai SmartID (Admin)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Compatibility Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Kanit', 'sans-serif'], } } } }
    </script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center py-6 px-4">
    <div class="w-full max-w-5xl space-y-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-1.5 bg-slate-800 p-1 rounded-lg border border-slate-700 shadow-inner">
                    <a href="scan.html" title="หน้าสแกนใบหน้า (Scan)" 
                       class="w-8 h-8 flex items-center justify-center bg-slate-700 hover:bg-slate-600 text-slate-300 hover:text-white font-bold rounded text-sm transition">S</a>
                    <a href="register.html" title="หน้าลงทะเบียน (Register)" 
                       class="w-8 h-8 flex items-center justify-center bg-slate-700 hover:bg-slate-600 text-slate-300 hover:text-white font-bold rounded text-sm transition">R</a>
                </div>
                <div class="h-8 w-[1px] bg-slate-700 mx-1"></div>
                <div>
                    <h1 class="text-xl font-extrabold text-blue-400 tracking-wide">หน้าสรุปผล (Dashboard)</h1>
                    <p class="text-xs text-slate-400">อยู่ระหว่างการพัฒนาฟีเจอร์รายงานผล</p>
                </div>
            </div>

            <button onclick="logoutAdmin()" class="bg-rose-900/50 hover:bg-rose-800 text-rose-300 hover:text-white px-3 py-2 rounded-lg border border-rose-800/50 transition flex items-center space-x-2 text-sm">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span class="hidden md:inline">ออก</span>
            </button>
        </div>

        <div class="glass-panel rounded-2xl p-8 text-center border border-slate-800 shadow-2xl mt-8">
            <i class="fa-solid fa-chart-line text-6xl text-slate-700 mb-4"></i>
            <h2 class="text-xl font-bold text-slate-300">ฟีเจอร์รายงานผล (Dashboard) กำลังจะมาเร็วๆ นี้</h2>
            <p class="text-sm text-slate-500 mt-2">หน้าที่สำหรับดูสถิติการสแกนและส่งออกไฟล์</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDdwhcIqbbSkK0MmGcVpyrzR8bW3TBLSMM",
            authDomain: "by-school-fscan.firebaseapp.com",
            projectId: "by-school-fscan",
            storageBucket: "by-school-fscan.firebasestorage.app",
            messagingSenderId: "577646754945",
            appId: "1:577646754945:web:32aa72f9f66fd40d512180"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
            if (!user) window.location.replace("login_scan.html");
        });

        function logoutAdmin() {
            auth.signOut().then(() => {
                window.location.replace("login_scan.html");
            });
        }
    </script>
</body>
</html>
