<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Buayai SmartID (Admin)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase Compatibility Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#0284c7',
                            dark: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center bg-slate-950 overflow-hidden relative selection:bg-amber-400 selection:text-slate-900">
    
    <!-- Background Decoration -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-40 animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-amber-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-pulse" style="animation-delay: 2s;"></div>

    <main class="relative z-10 w-full max-w-md p-6">
        <div class="glass-panel rounded-3xl p-8 shadow-2xl border border-slate-800">
            <!-- Header -->
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white text-3xl mb-6 shadow-lg shadow-blue-900/50">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-amber-400 tracking-wide mb-2">Buayai SmartID</h1>
                <p class="text-sm text-slate-400 font-medium">ระบบบันทึกการเข้าสถานศึกษาด้วยใบหน้า</p>
                <div class="mt-2 text-xs text-slate-500 bg-slate-900/50 py-1 px-3 rounded-full inline-block border border-slate-800">
                    <i class="fa-solid fa-lock text-emerald-400 mr-1"></i> เฉพาะผู้ดูแลระบบ (Admin Only)
                </div>
            </div>

            <!-- Error Message Box -->
            <div id="error-box" class="hidden mb-6 bg-rose-900/30 border border-rose-800 text-rose-400 text-sm p-3 rounded-xl flex items-start">
                <i class="fa-solid fa-circle-exclamation mt-1 mr-2"></i>
                <span id="error-message">อีเมลหรือรหัสผ่านไม่ถูกต้อง</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-slate-300 ml-1">อีเมลผู้ดูแลระบบ</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <input type="email" id="email" required
                               class="w-full bg-slate-900/80 border border-slate-700 text-slate-100 text-sm rounded-xl py-3.5 pl-11 pr-4 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition" 
                               placeholder="admin@school.com">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-semibold text-slate-300 ml-1">รหัสผ่าน</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-key"></i>
                        </div>
                        <input type="password" id="password" required
                               class="w-full bg-slate-900/80 border border-slate-700 text-slate-100 text-sm rounded-xl py-3.5 pl-11 pr-12 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition" 
                               placeholder="••••••••">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-200 focus:outline-none">
                            <i id="eye-icon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-900/40 transition-all flex justify-center items-center mt-4">
                    <span>เข้าสู่ระบบ</span>
                    <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
                </button>
            </form>
            
            <div class="mt-8 text-center text-xs text-slate-500">
                หากยังไม่มีบัญชี โปรดติดต่อผู้ดูแลระบบเครือข่ายของโรงเรียนเพื่อเพิ่มสิทธิ์การเข้าถึง
            </div>
        </div>
    </main>

    <script>
        // ================= Firebase Integration =================
        const firebaseConfig = {
            apiKey: "AIzaSyDdwhcIqbbSkK0MmGcVpyrzR8bW3TBLSMM",
            authDomain: "by-school-fscan.firebaseapp.com",
            projectId: "by-school-fscan",
            storageBucket: "by-school-fscan.firebasestorage.app",
            messagingSenderId: "577646754945",
            appId: "1:577646754945:web:32aa72f9f66fd40d512180"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Check if already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                // If already logged in, redirect to scanner page
                window.location.replace("scan.html");
            }
        });

        // ================= UI Logic =================
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showError(msg) {
            const box = document.getElementById('error-box');
            document.getElementById('error-message').innerText = msg;
            box.classList.remove('hidden');
            box.classList.add('animate-pulse');
            setTimeout(() => box.classList.remove('animate-pulse'), 500);
        }

        function hideError() {
            document.getElementById('error-box').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideError();
            const btn = document.getElementById('btn-submit');
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;
            btn.disabled = true;
            btn.classList.add('opacity-70');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Redirect will be handled by onAuthStateChanged
            } catch (error) {
                console.error(error.code);
                let errorMsg = "เกิดข้อผิดพลาดในการเข้าสู่ระบบ";
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    errorMsg = "อีเมลหรือรหัสผ่านไม่ถูกต้อง โปรดลองอีกครั้ง";
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg = "เข้าสู่ระบบผิดพลาดหลายครั้ง โปรดรอสักครู่แล้วลองใหม่";
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = "รูปแบบอีเมลไม่ถูกต้อง";
                }
                showError(errorMsg);
                
                // Reset button
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
            }
        }
    </script>
</body>
</html>
